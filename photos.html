<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<title>תמונות וטיימלאפס · BCI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="icon-btn" href="index.html" aria-label="לדשבורד" id="back"></a>
  <div class="t"><h1>תמונות וטיימלאפס</h1><div class="sub" id="sub">חדר גידול</div></div>
</header>

<main class="wrap grid">
  <div class="seg" id="tabs" style="justify-self:start"><button data-t="at" class="on">תמונה לפי זמן</button><button data-t="tl">טיימלאפס</button></div>

  <!-- one photo at a chosen time -->
  <section class="card" id="secAt">
    <div class="form">
      <label>תאריך<input type="date" id="aDate"></label>
      <label>שעה<input type="time" id="aTime" step="900"></label>
      <label>מצלמה<select class="cam" id="aCam"></select></label>
      <button class="btn primary" id="aGo">הצג</button>
      <button class="btn" id="aGrid">▦ גריד</button>
      <label class="chk"><input type="checkbox" id="aLive" checked> עדכון חי</label>
    </div>
    <div class="photo" id="aPhoto" style="margin-top:12px"><div class="empty">בחר תאריך ושעה</div></div>
    <div class="tiles" id="aTiles" style="margin-top:12px"></div>
    <div class="row-nav">
      <button class="btn" id="aPrev">‹ קודמת</button>
      <span class="muted small" id="aInfo"></span>
      <button class="btn" id="aNext">הבאה ›</button>
    </div>
  </section>

  <!-- timelapse -->
  <section class="card" id="secTl" hidden>
    <div class="form">
      <label>מתאריך<input type="date" id="tFrom"></label>
      <label>עד<input type="date" id="tTo"></label>
      <label>מצלמה<select class="cam" id="tCam"></select></label>
      <label>תמונות<select id="tMode"><option value="hour">אחת ביום</option><option value="all">כל התמונות</option></select></label>
      <label id="tHourL">בשעה<input type="number" id="tHour" min="0" max="23" value="12"></label>
      <label class="tAll">משעה<input type="time" id="tH0" value="00:00" step="900"></label>
      <label class="tAll">עד שעה<input type="time" id="tH1" value="23:59" step="900"></label>
      <label class="tAll chk"><input type="checkbox" id="tNight" checked> בלי תמונות לילה</label>
      <label>מהירות<select id="tFps"><option value="2">2 בשנייה</option><option value="5" selected>5 בשנייה</option><option value="10">10 בשנייה</option><option value="20">20 בשנייה</option></select></label>
      <label class="chk"><input type="checkbox" id="tData" checked> נתוני סביבה על התמונה</label>
      <button class="btn" id="tGrid">▦ גריד</button>
      <button class="btn primary" id="tGo">טען</button>
    </div>
    <div class="muted small" style="margin-top:6px">"כל התמונות": אפשר לבחור שעות (גם דרך חצות, למשל 18:00–06:00). "בלי תמונות לילה" בודק קודם באילו שעות החדר חשוך ולא מוריד אותן בכלל – הסרטון מוכן הרבה יותר מהר.</div>
    <div class="muted small" id="tMsg" style="margin-top:8px"></div>
    <div class="photo" id="tBox" style="margin-top:12px"><canvas id="tCv" style="width:100%;display:block"></canvas><div class="empty" id="tEmpty">בחר טווח ולחץ "טען"</div></div>
    <div class="row-nav" id="tCtl" hidden>
      <button class="btn primary" id="tPlay">▶ נגן</button>
      <input type="range" id="tSeek" min="0" value="0" style="flex:1">
      <button class="btn" id="tRec">⬇ הורד סרטון</button>
    </div>
  </section>
  <div class="msg" id="msg"></div>
</main>

<script src="app.js"></script>
<script>
$('back').innerHTML = ICON.back;
const S = { cams: [], st: null, lists: {}, frames: {}, day: [], i: 0, tl: [], k: 0, timer: null };
const cycle = store.get('cycle') || {};
const today = dayKey(Date.now());
const err = (e) => { $('msg').textContent = e.message || String(e); $('msg').className = 'msg err'; };

/* ---------- tabs ---------- */
$('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => {
  $('tabs').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  $('secAt').hidden = b.dataset.t !== 'at'; $('secTl').hidden = b.dataset.t !== 'tl'; store.set('photosTab', b.dataset.t);
});
if (store.get('photosTab') === 'tl') $('tabs').querySelectorAll('button')[1].click();

/* ---------- photo lists (the server lists the photos of one camera between two dates) ---------- */
async function camList(dev, from, to, hour) {
  const key = [dev, from, to, hour].join('|');
  if (!S.lists[key]) {
    const j = await api('action=photolist&device=' + encodeURIComponent(dev) + '&from=' + from + '&to=' + to + (hour != null ? '&hour=' + hour : ''));
    S.lists[key] = (j.photos || []).map((p) => ({ id: p.id, at: p.at, t: Date.parse(p.at) }));
  }
  return S.lists[key];
}
// two cameras: each photo of the first one with the photo of the second taken within 10 minutes
function pairUp(A, B) { const out = [], Bs = B.slice().sort((x, y) => x.t - y.t); let j = 0; A.forEach((p) => { while (j + 1 < Bs.length && Math.abs(Bs[j + 1].t - p.t) <= Math.abs(Bs[j].t - p.t)) j++; if (Bs[j] && Math.abs(Bs[j].t - p.t) <= 10 * 60000) out.push({ id: p.id, id2: Bs[j].id, t: p.t, at: p.at }); }); return out; }
async function items(cam, from, to, hour) {
  if (cam !== 'join') return camList(cam, from, to, hour);
  const [A, B] = await Promise.all([camList(S.cams[0], from, to, hour), camList(S.cams[1], from, to, hour)]);
  return pairUp(A, B);
}
async function frames(ids, w, onProgress) {
  const need = [...new Set(ids)].filter((id) => !S.frames[w + id]);
  for (let i = 0; i < need.length; i += 20) {
    const j = await apiPost({ action: 'tlframes', w, items: need.slice(i, i + 20).map((id) => ({ id })) });
    (j.frames || []).forEach((f) => { if (f.b64) S.frames[w + f.id] = 'data:image/jpeg;base64,' + f.b64; });
    if (onProgress) onProgress(Math.min(need.length, i + 20), need.length);
  }
}
async function srcOf(p, w) {
  await frames(p.id2 ? [p.id, p.id2] : [p.id], w);
  const a = S.frames[w + p.id]; if (!p.id2 || !a) return a || null;
  const [A, B] = await Promise.all([loadImg(a), loadImg(S.frames[w + p.id2])]);
  return A ? joinImages(A, B, S.st, A.width) : a;
}
const caption = (p) => { const cd = cycleDay(cycle, p.t); return dm(p.t) + ' · ' + hm(p.t) + (cd ? ' · יום ' + cd : ''); };

/* ---------- one photo at a chosen time ---------- */
async function showAt() {
  const d = $('aDate').value, tm = $('aTime').value || '12:00'; if (!d) return;
  $('msg').textContent = ''; $('aPhoto').innerHTML = '<div class="empty">טוען…</div>'; $('aInfo').textContent = '';
  try {
    S.day = await items($('aCam').value, d, d, null);
    if (!S.day.length) { $('aPhoto').innerHTML = '<div class="empty">אין תמונות בתאריך הזה</div>'; return; }
    const want = new Date(d + 'T' + tm + ':00').getTime();
    S.i = 0; S.day.forEach((p, i) => { if (Math.abs(p.t - want) < Math.abs(S.day[S.i].t - want)) S.i = i; });
    await drawAt();
  } catch (e) { err(e); $('aPhoto').innerHTML = '<div class="empty">לא נטען</div>'; }
}
/* air + weight at the moment of the photo (from the grow-room readings) */
S.grow = {};
async function growAround(t) {
  const days = Math.min(120, Math.ceil((Date.now() - t) / DAY) + 4);
  const key = Object.keys(S.grow).map(Number).filter((d) => d >= days).sort((a, b) => a - b)[0];
  if (key) return S.grow[key];
  const j = await api('action=grow&days=' + days);
  return (S.grow[days] = { P: plantNow(j.points || [], j.cycle || cycle), cycle: j.cycle || cycle });
}
function nearest(arr, t, maxMs) { let b = null; for (const x of arr) if (Math.abs(x.t - t) <= maxMs && (!b || Math.abs(x.t - t) < Math.abs(b.t - t))) b = x; return b; }
/* Seymour (the sensors in the room): temp / humidity and the light (PPFD), 30-minute averages, all sensors averaged */
S.sey = {};
async function seyAround(t) {
  const days = Math.min(60, Math.ceil((Date.now() - t) / DAY) + 2);
  const key = Object.keys(S.sey).map(Number).filter((d) => d >= days).sort((a, b) => a - b)[0];
  if (key) return S.sey[key];
  const j = await api('action=seymour&days=' + days).catch(() => ({ sensors: [] })), by = {};
  (j.sensors || []).forEach((x) => (x.points || []).forEach((p) => { const b = by[p.at] || (by[p.at] = { t: Date.parse(p.at), n: 0, temp: 0, rh: 0, np: 0, ppfd: 0 }); if (p.t != null && p.h != null) { b.n++; b.temp += p.t; b.rh += p.h; } if (p.ppfd != null) { b.np++; b.ppfd += p.ppfd; } }));
  const pts = Object.values(by).sort((a, b) => a.t - b.t);
  return (S.sey[days] = {
    air: pts.filter((b) => b.n).map((b) => ({ t: b.t, temp: b.temp / b.n, rh: b.rh / b.n, vpd: vpdOf(b.temp / b.n, b.rh / b.n) })),
    ppfd: pts.filter((b) => b.np).map((b) => ({ t: b.t, v: b.ppfd / b.np })),
    hasLight: (j.sensors || []).some((x) => x.ppfdKey), on: (j.sensors || []).length > 0,
  });
}
/** everything known about the room at time t: stage, air (the M5 sensor, else Seymour), PPFD (Seymour) */
function envAt(g, sy, t) {
  const a = nearest(g.P.air, t, 30 * 60000) || (sy ? nearest(sy.air, t, 45 * 60000) : null);
  const p = sy ? nearest(sy.ppfd, t, 45 * 60000) : null;
  return { a, ppfd: p ? p.v : null, po: phaseOf(g.cycle, t) };
}
async function readingsAt(t) {
  $('aTiles').innerHTML = [tile('VPD', '…', 'kPa', ''), tile('טמפ׳ · לחות', '…', '', ''), tile('PPFD', '…', 'µmol', ''), tile('משקל', '…', 'g', ''), tile('ייבוש', '…', '%', '')].join('');
  try {
    const [g, sy] = await Promise.all([growAround(t), seyAround(t)]), E = envAt(g, sy, t), a = E.a, w = nearest(g.P.A.pts, t, 30 * 60000), lim = g.P.lim;
    const dbc = w && w.db != null ? (w.db >= lim ? 'bad' : w.db >= lim * .8 ? 'warn' : '') : '';
    const lastIrr = g.P.A.ev.filter((e) => e.t <= t).pop();
    $('aTiles').innerHTML = [
      tile('VPD', a ? fmt(a.vpd, 2) : '—', 'kPa', a ? 'נמדד ' + hm(a.t) : 'אין מדידה סמוך לתמונה', a ? vpdState(a.vpd) : ''),
      tile('טמפ׳ · לחות', a ? fmt(a.temp, 1) + '°' : '—', a ? fmt(a.rh) + '%' : '', E.po ? phaseText(E.po) : ''),
      tile('PPFD', E.ppfd != null ? fmt(E.ppfd) : '—', 'µmol', E.ppfd != null ? 'Seymour' : sy.hasLight ? 'אין מדידה סמוך לתמונה' : 'לא נמצא חיישן אור ב-Seymour'),
      tile('משקל', w ? fmt(w.w) : '—', 'g', w && w.full ? 'מלא ' + fmt(w.full) + ' g' : ''),
      tile('ייבוש', w && w.db != null ? fmt(w.db, 1) : '—', '%', lastIrr ? 'השקיה אחרונה ' + dm(lastIrr.t) + ' ' + hm(lastIrr.t) : 'סף ' + lim + '%', dbc),
    ].join('');
  } catch (e) { $('aTiles').innerHTML = '<div class="muted small">' + esc(e.message) + '</div>'; }
}
async function drawAt() {
  const p = S.day[S.i]; if (!p) return;
  readingsAt(p.t);
  $('aInfo').textContent = (S.i + 1) + ' / ' + S.day.length + ' ביום הזה';
  const src = await srcOf(p, 1280);
  if (!src) { $('aPhoto').innerHTML = '<div class="empty">התמונה לא נטענה</div>'; return; }
  $('aPhoto').innerHTML = '<img alt=""><div class="cap"><span>' + caption(p) + '</span><span class="r">' + ago(p.t) + '</span></div>';
  const img = $('aPhoto').querySelector('img'); img.src = src; img.onclick = () => lightbox(src, caption(p));
  gridOver($('aPhoto'));
  $('aTime').value = hm(p.t);
}
$('aGo').onclick = showAt;
$('aPrev').onclick = () => { if (S.i > 0) { S.i--; drawAt(); } };
$('aNext').onclick = () => { if (S.i < S.day.length - 1) { S.i++; drawAt(); } };

/* ---------- timelapse ---------- */
const MAXF = 400;
$('tMode').onchange = () => { const one = $('tMode').value === 'hour'; $('tHourL').style.display = one ? '' : 'none'; document.querySelectorAll('.tAll').forEach((el) => { el.style.display = one ? 'none' : ''; }); store.set('tlForm', { mode: $('tMode').value, h0: $('tH0').value, h1: $('tH1').value, night: $('tNight').checked, data: $('tData').checked }); };
['tH0', 'tH1', 'tNight', 'tData'].forEach((id) => $(id).addEventListener('change', $('tMode').onchange));
$('tData').addEventListener('change', () => drawTl());
(() => { const f = store.get('tlForm'); if (f) { $('tMode').value = f.mode || 'hour'; $('tH0').value = f.h0 || '00:00'; $('tH1').value = f.h1 || '23:59'; $('tNight').checked = f.night !== false; $('tData').checked = f.data !== false; } $('tMode').onchange(); })();
const hOf = (t) => { const d = new Date(t); return d.getHours() + d.getMinutes() / 60; };
const hhmm = (v) => { const [a, b] = String(v || '0:0').split(':').map(Number); return a + (b || 0) / 60; };
const inHours = (t, h0, h1) => { const h = hOf(t); return h0 <= h1 ? h >= h0 && h <= h1 : h >= h0 || h <= h1; };
/** how bright a picture is (0–255): the average of a 32×24 copy */
function lumOf(im) { const c = document.createElement('canvas'); c.width = 32; c.height = 24; const x = c.getContext('2d'); x.drawImage(im, 0, 0, 32, 24); const d = x.getImageData(0, 0, 32, 24).data; let s = 0; for (let i = 0; i < d.length; i += 4) s += .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]; return s / (d.length / 4); }
const darkLimit = (L) => { const v = L.filter(isFinite).sort((a, b) => a - b); const ref = v.length ? v[Math.floor(v.length * .75)] : 255; return Math.max(18, ref * .35); };
/** finds the hours when the lights are off from a few small photos (one per hour from the first and the last day), so they are never downloaded */
async function darkHours(list) {
  const byH = {}; list.forEach((p) => { const h = new Date(p.t).getHours(); (byH[h] = byH[h] || []).push(p); });
  const sample = []; Object.keys(byH).forEach((h) => { const L = byH[h]; sample.push(L[0]); if (L.length > 1) sample.push(L[L.length - 1]); });
  await frames(sample.map((p) => p.id), 320, (a, n) => { $('tMsg').textContent = 'בודק באילו שעות החדר חשוך… ' + a + ' / ' + n; });
  const lum = await Promise.all(sample.map(async (p) => { const im = await loadImg(S.frames[320 + p.id]); return im ? lumOf(im) : NaN; }));
  const lim = darkLimit(lum), dark = {};
  sample.forEach((p, i) => { const h = new Date(p.t).getHours(); if (!isFinite(lum[i])) return; dark[h] = (dark[h] === undefined ? true : dark[h]) && lum[i] < lim; });
  return { hours: Object.keys(dark).filter((h) => dark[h]).map(Number), lim };
}
const hoursText = (H) => { if (!H.length) return 'אין'; H = H.slice().sort((a, b) => a - b); const r = []; let a = H[0], b = H[0]; for (let i = 1; i <= H.length; i++) { if (H[i] === b + 1) { b = H[i]; continue; } r.push([a, b + 1]); a = b = H[i]; } if (r.length > 1 && r[0][0] === 0 && r[r.length - 1][1] === 24) { r[0][0] = r.pop()[0]; } const f = (h) => String(h % 24).padStart(2, '0') + ':00'; return r.map((x) => f(x[0]) + '–' + f(x[1])).join(', '); };
async function loadTl() {
  stop(); $('msg').textContent = '';
  const from = $('tFrom').value, to = $('tTo').value, hour = $('tMode').value === 'hour' ? +$('tHour').value : null, all = hour == null;
  if (!from || !to || from > to) { $('tMsg').textContent = 'בדוק את התאריכים'; return; }
  $('tMsg').textContent = 'מחפש תמונות…'; $('tCtl').hidden = true;
  try {
    const t0 = new Date(from + 'T00:00:00').getTime();
    const envP = Promise.all([growAround(t0), seyAround(t0)]).catch(() => [null, null]);   // the room data comes in while the photos load
    let list = await items($('tCam').value, from, to, hour), note = [];
    if (!list.length) { $('tMsg').textContent = 'אין תמונות בטווח הזה'; return; }
    if (all) {
      const h0 = hhmm($('tH0').value), h1 = hhmm($('tH1').value);
      list = list.filter((p) => inHours(p.t, h0, h1));
      if (!list.length) { $('tMsg').textContent = 'אין תמונות בשעות האלה'; return; }
    }
    let lim = null;
    if (all && $('tNight').checked) {
      const D = await darkHours(list); lim = D.lim;
      const keep = list.filter((p) => !D.hours.includes(new Date(p.t).getHours()));
      if (keep.length) { note.push('שעות חושך שדולגו: ' + hoursText(D.hours) + ' (' + (list.length - keep.length) + ' תמונות)'); list = keep; }
    }
    if (list.length > MAXF) { const step = list.length / MAXF; list = Array.from({ length: MAXF }, (_, i) => list[Math.floor(i * step)]); note.push('נבחרו ' + MAXF + ' תמונות מפוזרות על הטווח'); }
    const ids = list.flatMap((p) => p.id2 ? [p.id, p.id2] : [p.id]);
    await frames(ids, 640, (a, n) => { $('tMsg').textContent = 'טוען תמונות ' + a + ' / ' + n; });
    $('tMsg').textContent = 'מכין…';
    S.tl = []; let dropped = 0;
    for (const p of list) {
      const src = await srcOf(p, 640), im = await loadImg(src); if (!im) continue;
      if (lim != null && lumOf(im) < lim) { dropped++; continue; }                // a dark photo in an hour that is usually lit
      S.tl.push({ im, p });
    }
    if (dropped) note.push(dropped + ' תמונות חשוכות נוספות הוסרו');
    if (!S.tl.length) { $('tMsg').textContent = 'התמונות לא נטענו'; return; }
    const [g, sy] = await envP;
    S.tl.forEach((f) => { f.env = g ? envAt(g, sy, f.p.t) : null; });
    if ($('tData').checked && sy && !sy.hasLight) note.push(sy.on ? 'לא נמצא חיישן PPFD ב-Seymour' : 'Seymour לא מחובר – אין PPFD');
    const cv = $('tCv'); cv.width = S.tl[0].im.width; cv.height = S.tl[0].im.height;
    $('tEmpty').style.display = 'none'; $('tCtl').hidden = false; $('tSeek').max = S.tl.length - 1;
    $('tMsg').textContent = S.tl.length + ' תמונות · ' + dm(S.tl[0].p.t) + ' – ' + dm(S.tl[S.tl.length - 1].p.t) + ' · ' + (S.tl.length / +$('tFps').value).toFixed(1) + ' שניות' + (note.length ? ' · ' + note.join(' · ') : '');
    S.k = 0; drawTl(); play();
  } catch (e) { err(e); $('tMsg').textContent = ''; }
}
const rr = (x, a, b, w, h, r) => { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); };
const STC = { good: '#3ddc97', warn: '#f5b942', bad: '#ff6b6b', '': 'rgba(255,255,255,.25)', off: 'rgba(255,255,255,.25)' };
function drawTl() {
  const f = S.tl[S.k]; if (!f) return;
  const cv = $('tCv'), x = cv.getContext('2d'), W = cv.width, H = cv.height, fs = Math.max(12, Math.round(W / 34)), pad = Math.round(fs * .7);
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.drawImage(f.im, 0, 0, W, H);
  gridCanvas(x, W, H);
  const E = $('tData').checked ? f.env : null, bh = E ? fs * 4.4 : fs * 2.6;
  const g = x.createLinearGradient(0, H - bh, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,.8)'); x.fillStyle = g; x.fillRect(0, H - bh, W, bh);
  x.fillStyle = '#fff'; x.font = '700 ' + fs + 'px Heebo, sans-serif'; x.textAlign = 'right'; x.direction = 'rtl'; x.textBaseline = 'alphabetic';
  const line1 = dm(f.p.t) + ' · ' + hm(f.p.t) + (E && E.po ? ' · ' + phaseText(E.po) : (cycleDay(cycle, f.p.t) ? ' · יום ' + cycleDay(cycle, f.p.t) : ''));
  x.fillText(line1, W - pad, E ? H - fs * 2.15 : H - pad);
  if (E) {
    const a = E.a, ph = E.po && E.po.ph, items = [
      ['°C', a ? fmt(a.temp, 1) : '—', a && ph ? band(a.temp, ph.temp, 1.5) : ''],
      ['RH', a ? fmt(a.rh) + '%' : '—', a && ph ? band(a.rh, ph.rh, 5) : ''],
      ['VPD', a ? fmt(a.vpd, 2) : '—', a && ph ? band(a.vpd, ph.vpd, .15) : ''],
      ['PPFD', E.ppfd != null ? fmt(E.ppfd) : '—', 'n'],
    ];
    const f2 = Math.round(fs * .92); x.direction = 'ltr'; x.textAlign = 'left';
    let X = W - pad; const y = H - pad - f2 * 1.55, h = f2 * 1.55;
    items.forEach(([k, v, st]) => {
      x.font = '500 ' + Math.round(f2 * .8) + 'px Heebo, sans-serif'; const kw = x.measureText(k).width;
      x.font = '800 ' + f2 + 'px Heebo, sans-serif'; const vw = x.measureText(v).width, w = kw + vw + f2 * 1.2;
      X -= w; rr(x, X, y, w, h, h / 2); x.fillStyle = 'rgba(10,14,20,.6)'; x.fill(); x.lineWidth = Math.max(1.5, f2 / 9); x.strokeStyle = st === 'n' || !a || !ph || st === 'off' ? STC[''] : STC[st || 'good']; x.stroke();
      x.fillStyle = 'rgba(255,255,255,.75)'; x.font = '500 ' + Math.round(f2 * .8) + 'px Heebo, sans-serif'; x.fillText(k, X + f2 * .55, y + h * .68);
      x.fillStyle = '#fff'; x.font = '800 ' + f2 + 'px Heebo, sans-serif'; x.fillText(v, X + f2 * .65 + kw, y + h * .7);
      X -= f2 * .45;
    });
  }
  $('tSeek').value = S.k;
}
function play() {
  stop(); $('tPlay').textContent = '⏸ עצור';
  S.timer = setInterval(() => { S.k = (S.k + 1) % S.tl.length; drawTl(); if (S.rec && S.k === 0) finishRec(); }, 1000 / +$('tFps').value);
}
function stop() { if (S.timer) clearInterval(S.timer); S.timer = null; $('tPlay').textContent = '▶ נגן'; }
$('tGo').onclick = loadTl;
gridBtn($('tGrid'), () => { drawTl(); gridOver($('aPhoto')); });
gridBtn($('aGrid'), () => { drawTl(); gridOver($('aPhoto')); });
$('tPlay').onclick = () => S.timer ? stop() : play();
$('tSeek').oninput = () => { stop(); S.k = +$('tSeek').value; drawTl(); };
$('tFps').onchange = () => { if (S.timer) play(); };
// saves the video: plays it once from the start while recording the picture
$('tRec').onclick = () => {
  if (!window.MediaRecorder || !$('tCv').captureStream) { $('tMsg').textContent = 'הדפדפן הזה לא יודע לשמור סרטון'; return; }
  const type = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t)); if (!type) { $('tMsg').textContent = 'הדפדפן הזה לא יודע לשמור סרטון'; return; }
  const chunks = [], r = new MediaRecorder($('tCv').captureStream(+$('tFps').value), { mimeType: type, videoBitsPerSecond: 4e6 });
  r.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  r.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type })); a.download = 'timelapse_' + $('tFrom').value + '_' + $('tTo').value + (type.includes('mp4') ? '.mp4' : '.webm'); a.click(); $('tRec').disabled = false; $('tMsg').textContent = 'הסרטון נשמר'; };
  S.rec = r; $('tRec').disabled = true; $('tMsg').textContent = 'מקליט…'; S.k = 0; drawTl(); r.start(); play();
};
function finishRec() { const r = S.rec; S.rec = null; setTimeout(() => r.stop(), 1000 / +$('tFps').value); }

/* ---------- live: today's photo follows the newest one, and the readings are read again (every minute) ---------- */
async function live() {
  if (document.hidden || $('secAt').hidden || !$('aLive').checked || $('aDate').value !== dayKey(Date.now())) return;
  const atEnd = !S.day.length || S.i >= S.day.length - 1, d = $('aDate').value, cam = $('aCam').value;
  Object.keys(S.lists).filter((k) => k.includes('|' + d + '|' + d + '|')).forEach((k) => delete S.lists[k]);
  S.grow = {}; S.sey = {};
  try {
    const L = await items(cam, d, d, null); if (!L.length) return;
    const cur = S.day[S.i]; S.day = L;
    S.i = atEnd ? L.length - 1 : Math.max(0, L.findIndex((p) => cur && p.id === cur.id));
    if (atEnd && (!cur || cur.id !== L[L.length - 1].id)) await drawAt(); else { readingsAt(S.day[S.i].t); $('aInfo').textContent = (S.i + 1) + ' / ' + S.day.length + ' ביום הזה'; const c = $('aPhoto').querySelector('.cap .r'); if (c) c.textContent = ago(S.day[S.i].t); }
  } catch (e) {}
}
setInterval(live, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) live(); });

/* ---------- start ---------- */
async function init() {
  $('aDate').value = today; $('aTime').value = String(new Date().getHours()).padStart(2, '0') + ':00';
  $('tTo').value = today; $('tFrom').value = cycle.start || dayKey(Date.now() - 14 * DAY);
  try {
    const [gp, pl] = await Promise.all([api('action=growphotos&days=1'), api('action=photolist&from=' + today + '&to=' + today)]);
    // every camera that has photos; the joined picture uses the alignment saved in the admin page, or simply camera 1 above camera 2
    const devs = (pl.devices || []).filter((d) => /cam/i.test(d)).sort();
    S.st = gp.stitch || (devs.length > 1 ? { a: devs[0], b: devs[1], dx: 0, dy: 0.75, s: 1, r: 0 } : null);
    S.cams = S.st ? [S.st.a, S.st.b].concat(devs.filter((d) => d !== S.st.a && d !== S.st.b)) : (devs.length ? devs : gp.cams || []);
    const opts = (S.st && S.cams[1] ? '<option value="join">שתי המצלמות מחוברות</option>' : '') + S.cams.map((c) => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
    document.querySelectorAll('select.cam').forEach((s) => { s.innerHTML = opts; });
    showAt();
  } catch (e) { err(e); }
}
init();
</script>
