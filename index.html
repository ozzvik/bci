<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>BCI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img class="logo" src="icon-192.png" alt="">
  <div class="t"><h1>BCI</h1><div class="sub" id="sub">טוען…</div></div>
  <button class="icon-btn" id="settings" aria-label="קישורים"></button>
  <button class="icon-btn" id="refresh" aria-label="רענון"></button>
</header>

<main class="wrap">
  <!-- 1. what needs attention now -->
  <div class="alerts" id="alerts"></div>

  <!-- 2. live metrics -->
  <section class="grp"><h2>🌿 חדר גידול <span class="r" id="gSub"></span></h2><div class="tiles" id="gTiles"></div></section>
  <section class="grp"><h2>🌱 ריבוי <span class="r" id="pSub"></span></h2><div class="tiles" id="pTiles"></div></section>

  <!-- 3. where to go -->
  <section class="grp"><h2>אזורים</h2>
    <nav class="caro" id="caro">
      <a id="cMgmt" style="--c:#d4a820"><span class="ic">🗂️</span><b>ניהול</b><small id="cMgmtS">CannaFlow</small></a>
      <a href="prop.html" style="--c:#5090e0"><span class="ic">🌱</span><b>ריבוי</b><small id="cPropS">אמהות ומגשי השרשה</small></a>
      <a href="batch.html" style="--c:#5ec98a"><span class="ic">🌿</span><b>גידול</b><small id="cGrow">האצווה בחדר הפריחה</small></a>
      <a class="soon" style="--c:#a89be8"><span class="ic">📦</span><b>מלאי</b><small>בקרוב</small></a>
      <a href="fert.html" style="--c:#1f9e8f"><span class="ic">💧</span><b>דישון</b><small>מחשבון הזרקה ותוכניות</small></a>
    </nav>
  </section>
  <div class="msg" id="msg"></div>
</main>

<dialog id="dlg" style="border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);max-width:520px;width:calc(100% - 32px)">
  <form method="dialog">
    <h3 style="margin-top:0">קישורים לאפליקציות</h3>
    <p class="muted small">הדבק את הקישורים שבהם אתה פותח את האפליקציות. הם נשמרים רק במכשיר הזה.</p>
    <style>#dlg input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);margin-bottom:12px}</style>
    <label class="small">דף ניהול ריבוי (אדמין)<input id="uAdmin" dir="ltr"></label>
    <label class="small">אפליקציית העובד (סבב שקילה)<input id="uWorker" dir="ltr"></label>
    <label class="small">CannaFlow (ניהול)<input id="uMgmt" dir="ltr"></label>
    <div class="links"><button class="btn primary" value="save">שמור</button><button class="btn" value="cancel">ביטול</button></div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
$('refresh').innerHTML = ICON.refresh; $('settings').innerHTML = ICON.gear;
const S = { grow: null, hub: null, photoAt: null };       // the last answers – the alerts are built from all of them together
const MIN = 60000, old = (t, m) => t == null || Date.now() - t > m * MIN;

function renderGrow(j) {
  S.grow = j;
  const c = j.cycle || {}, P = plantNow(j.points || [], c), d = cycleDay(c, Date.now()), a = P.airNow;
  S.P = P;
  $('gSub').textContent = (c.name || '') + (d ? (c.name ? ' · ' : '') + 'יום ' + d : '');
  const vs = a ? vpdState(a.vpd) : '', dbc = P.db >= P.lim ? 'bad' : P.db >= P.lim * .8 ? 'warn' : '';
  const eta = P.eta == null ? '—' : P.eta === 0 ? 'עכשיו' : P.eta < 48 ? hm(P.t + P.eta * 3600000) : '> יומיים';
  $('gTiles').innerHTML = [
    tile('VPD', a ? fmt(a.vpd, 2) : '—', 'kPa', a ? ago(a.t) : 'אין נתון', vs),
    tile('טמפ׳ · לחות', a ? fmt(a.temp, 1) + '°' : '—', a ? fmt(a.rh) + '%' : '', ''),
    tile('ייבוש', fmt(P.db, 1), '%', 'סף ' + P.lim + '%', dbc, '<div class="bar ' + dbc + '"><i style="width:' + Math.max(0, Math.min(100, (P.db || 0) / P.lim * 100)) + '%"></i></div>'),
    tile('השקיה הבאה', eta, '', P.w != null ? '<span class="num">' + fmt(P.w) + ' g</span>' : ''),
  ].join('');
  $('cGrow').textContent = (c.name || 'האצווה בחדר הפריחה') + (d ? ' · יום ' + d : '');
  alerts();
}
function renderProp(j) {
  S.hub = j;
  const p = j.prop || {}, cl = j.climate, r = p.round;
  const trays = (p.batches || []).reduce((s, b) => s + (b.trays || 0), 0);
  $('pSub').textContent = (p.batches || []).length + ' אצוות · ' + trays + ' מגשים';
  $('pTiles').innerHTML = [
    tile('VPD', cl ? fmt(cl.vpd, 2) : '—', 'kPa', cl ? ago(Date.parse(cl.at)) + (cl.source ? ' · ' + cl.source : '') : 'אין נתון', cl ? vpdState(cl.vpd) : ''),
    tile('טמפ׳ · לחות', cl ? fmt(cl.temp, 1) + '°' : '—', cl ? fmt(cl.rh) + '%' : '', ''),
    tile('נשקלו היום', r ? r.weighed : '—', r ? '/ ' + r.active : '', r && r.active ? (r.weighed >= r.active ? 'הסבב הושלם' : 'נשארו ' + (r.active - r.weighed)) : '', r && r.active && r.weighed >= r.active ? 'good' : ''),
    tile('צריכים השקיה', (p.water || []).length, '', 'מגשים מעל הסף', (p.water || []).length ? 'warn' : 'good'),
  ].join('');
  $('cPropS').textContent = (p.batches || []).length + ' אצוות · ' + trays + ' מגשים';
  links(); alerts();
}
async function renderPhoto(gp) {
  const all = []; Object.keys(gp.lists || {}).forEach((k) => (gp.lists[k] || []).forEach((x) => all.push(Date.parse(x.at))));
  (gp.latest || []).forEach((x) => x && x.at && all.push(Date.parse(x.at)));
  S.photoAt = all.length ? Math.max.apply(null, all) : null; S.photoKnown = true;
  alerts();
}

/* what needs attention, the most urgent first */
function alerts() {
  const A = [], P = S.P, h = S.hub;
  if (P) {
    if (P.db != null && P.db >= P.lim) A.push(['bad', '💧 חדר גידול: ייבוש ' + fmt(P.db, 1) + '% – הגיע הזמן להשקות', 'batch.html']);
    if (old(P.t, 30)) A.push(['bad', '⚖️ המשקל בחדר הגידול לא מדווח' + (P.t ? ' (' + ago(P.t) + ')' : ''), 'grow.html']);
    const a = P.airNow;
    if (!a || old(a.t, 30)) A.push(['', '🌡️ חיישן האוויר בחדר הגידול לא מדווח' + (a ? ' (' + ago(a.t) + ')' : ''), 'grow.html']);
    else if (vpdState(a.vpd) === 'bad') A.push(['', '🌡️ VPD בחדר הגידול מחוץ לטווח: ' + fmt(a.vpd, 2) + ' kPa', 'batch.html']);
  }
  if (S.photoKnown && old(S.photoAt, 120)) A.push(['', '📷 המצלמות לא מעלות תמונות' + (S.photoAt ? ' – אחרונה ' + ago(S.photoAt) : ''), 'photos.html']);
  if (h) {
    const w = (h.prop && h.prop.water || []).length, cl = h.climate;
    if (w) A.push(['', '🌱 ' + w + ' מגשים בריבוי צריכים השקיה', 'prop.html']);
    if (!cl || old(Date.parse(cl.at), 90)) A.push(['', '🌡️ אין נתוני אקלים עדכניים מהריבוי', '']);
    else if (vpdState(cl.vpd) === 'bad') A.push(['', '🌡️ VPD בריבוי מחוץ לטווח: ' + fmt(cl.vpd, 2) + ' kPa', '']);
  }
  A.sort((x, y) => (y[0] === 'bad') - (x[0] === 'bad'));
  $('alerts').innerHTML = A.length
    ? A.map((x) => '<a class="alert ' + x[0] + '"' + (x[2] ? ' href="' + esc(x[2]) + '"' : '') + '>' + esc(x[1]) + (x[2] ? '<span class="go">‹</span>' : '') + '</a>').join('')
    : '';
}

/* links kept in this phone */
function links() {
  const ua = store.get('adminUrl'), uw = store.get('workerUrl'), um = store.get('mgmtUrl');
  const set = (id, sid, url, txt) => { const el = $(id); if (url) { el.href = url; el.onclick = null; } else { el.removeAttribute('href'); el.onclick = openDlg; $(sid).textContent = 'הוסף קישור'; } };
  set('cMgmt', 'cMgmtS', um); if (um) $('cMgmtS').textContent = 'CannaFlow · משימות ותכנון';
}
function openDlg() { $('uAdmin').value = store.get('adminUrl') || ''; $('uWorker').value = store.get('workerUrl') || ''; $('uMgmt').value = store.get('mgmtUrl') || ''; $('dlg').showModal(); }
$('dlg').addEventListener('close', () => { if ($('dlg').returnValue === 'save') { store.set('adminUrl', $('uAdmin').value.trim()); store.set('workerUrl', $('uWorker').value.trim()); store.set('mgmtUrl', $('uMgmt').value.trim()); links(); alerts(); } });
$('settings').onclick = openDlg;

async function loadAll() {
  $('refresh').classList.add('spin'); $('msg').textContent = ''; $('msg').className = 'msg';
  const err = (e, had) => { $('msg').textContent = (had ? 'מוצגים הנתונים האחרונים שנשמרו · ' : '') + e.message; $('msg').className = 'msg err'; };
  await Promise.all([
    cached('grow3', 'action=grow&days=3', renderGrow, err),
    cached('hub', 'action=hub', renderProp, err),
    cached('growphotos', 'action=growphotos&days=7', renderPhoto, err),
  ]);
  $('sub').textContent = 'עודכן ' + hm(Date.now());
  $('refresh').classList.remove('spin');
}
links();
$('refresh').onclick = loadAll;
loadAll();
setInterval(() => { if (!document.hidden) loadAll(); }, 5 * 60000);
</script>
</body>
</html>
