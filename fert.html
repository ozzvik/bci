<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>דישון · BCI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root { --fert: var(--accent); --fert-d: var(--accent-d); }
  .icon-btn.fert svg { stroke: var(--fert); }
  /* hero: ליטר/קוב לכל סטוק */
  .hero { background: linear-gradient(160deg, color-mix(in srgb, var(--fert) 14%, transparent), var(--card)); border: 1px solid color-mix(in srgb, var(--fert) 35%, var(--line)); border-radius: var(--radius); padding: 14px; }
  .hero .ht { font-size: calc(13px * var(--fs, 1)); font-weight: 800; color: var(--fert); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .hero .ht .r { margin-inline-start: auto; font-weight: 500; font-size: calc(12px * var(--fs, 1)); color: var(--muted); }
  .srow { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .srow:last-child { border-bottom: 0; }
  .srow .tag, .stock-ed .sh .tag { padding: 0; }
  .srow .tag { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: calc(13px * var(--fs, 1)); color: #fff; flex: none; }
  .srow .nm { flex: 1; min-width: 0; font-weight: 700; font-size: calc(14px * var(--fs, 1)); }
  .srow .nm small { display: block; color: var(--muted); font-weight: 500; font-size: calc(11.5px * var(--fs, 1)); }
  .srow .inp { display: flex; align-items: center; gap: 6px; }
  .srow input { width: 72px; font: inherit; font-size: calc(15px * var(--fs, 1)); font-weight: 700; text-align: center; color: var(--ink); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 4px; direction: ltr; }
  .srow .u { color: var(--muted); font-size: calc(11.5px * var(--fs, 1)); }
  .srow .val { font-size: calc(19px * var(--fs, 1)); font-weight: 900; direction: ltr; min-width: 58px; text-align: end; }
  .srow .val small { font-size: calc(11px * var(--fs, 1)); color: var(--muted); font-weight: 600; }
  /* elements vs target */
  .elem { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .el { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
  .el .n { font-size: calc(12px * var(--fs, 1)); font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
  .el .n b { color: var(--ink); font-weight: 800; direction: ltr; font-size: calc(15px * var(--fs, 1)); }
  .el .n .tg { font-size: calc(10.5px * var(--fs, 1)); color: var(--faint); direction: ltr; }
  .el .bar { height: 5px; }
  .el .tgt { display: flex; align-items: center; gap: 6px; font-size: calc(11px * var(--fs, 1)); color: var(--muted); font-weight: 600; margin-top: 6px; }
  .el .tgt input { flex: 1; min-width: 0; width: 100%; font: inherit; font-size: calc(14px * var(--fs, 1)); font-weight: 700; text-align: center; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 2px; direction: ltr; }
  .el .bar i { background: var(--fert); }
  .el.over .bar i { background: var(--amber); }
  .el.low .bar i { background: var(--blue); }
  .tog { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .tog b { font-size: calc(13px * var(--fs, 1)); font-weight: 700; color: var(--muted); padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .tog b.on { background: var(--fert); color: #fff; }
  .btn.fert { background: var(--fert-d); border-color: var(--fert-d); color: #fff; }
  .seg button.on { color: var(--fert); }
  .feg { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .feg label { display: flex; align-items: center; gap: 4px; background: var(--card2); border-radius: 9px; padding: 5px 7px; font-size: calc(12px * var(--fs, 1)); color: var(--muted); }
  .feg label b { min-width: 34px; color: var(--ink); direction: ltr; }
  .feg input { width: 100%; min-width: 0; font: inherit; font-weight: 700; text-align: center; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 5px 2px; direction: ltr; }
  .dtab { width: 100%; border-collapse: collapse; font-size: calc(13px * var(--fs, 1)); }
  .dtab th { color: var(--muted); font-weight: 600; text-align: start; padding: 3px 4px; } .dtab td { padding: 5px 4px; border-top: 1px solid var(--line); direction: ltr; text-align: start; }
  .dtab td:first-child { direction: rtl; } .up { color: var(--green); } .dn { color: var(--red); }
  .hist { margin: 6px 0 0; padding: 6px 0 0; border-top: 1px dashed var(--line); font-size: calc(12.5px * var(--fs, 1)); }
  .hist div { display: flex; gap: 8px; align-items: center; padding: 3px 0; } .hist span { flex: 1; color: var(--muted); }
  .psel { display: flex; align-items: center; gap: 8px; min-width: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; flex: 1; }
  .psel select { flex: 1; min-width: 0; width: 100%; text-overflow: ellipsis; font: inherit; font-size: calc(15px * var(--fs, 1)); font-weight: 700; color: var(--ink); background: none; border: 0; }
  .stock-ed { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .stock-ed .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .stock-ed .sh .tag { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: calc(12px * var(--fs, 1)); }
  .stock-ed .sh b { font-size: calc(15px * var(--fs, 1)); }
  .itrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .itrow select { flex: 1; font: inherit; font-size: calc(13.5px * var(--fs, 1)); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; min-width: 0; }
  .itrow input { width: 86px; font: inherit; font-size: calc(14px * var(--fs, 1)); text-align: center; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 7px 4px; direction: ltr; }
  .itrow .del { color: var(--red); font-size: calc(18px * var(--fs, 1)); padding: 0 6px; }
  .plist .it { cursor: pointer; }
  .plist .it.on { border-color: var(--fert); background: color-mix(in srgb, var(--fert) 10%, var(--card2)); }
  .banner { font-size: calc(12.5px * var(--fs, 1)); color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 30%, var(--line)); border-radius: 12px; padding: 9px 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<header class="top">
  <a class="icon-btn" href="index.html" aria-label="חזרה" id="back"></a>
  <div class="t"><h1>דישון</h1><div class="sub" id="sub">מחשבון הזרקה</div></div>
  <button class="icon-btn fert" id="refresh" aria-label="רענון"></button>
</header>

<main class="wrap">
  <div class="seg" style="width:100%;margin-bottom:14px">
    <button class="on" data-tab="calc" style="flex:1">מחשבון</button>
    <button data-tab="stocks" style="flex:1">סטוקים</button>
    <button data-tab="programs" style="flex:1">תוכניות</button>
  </div>
  <div class="banner" id="banner" hidden></div>

  <!-- ===== מחשבון ===== -->
  <section id="tab-calc">
    <div class="grid two">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card" style="padding:14px">
          <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
            <div class="psel"><span style="font-size:18px">📋</span><select id="prog"></select></div>
            <span class="tog" id="mode"><b data-m="ec" class="on">EC</b><b data-m="ppm">ppm</b></span>
          </div>
          <div id="ecTargetRow" style="margin-top:10px;display:flex;align-items:center;gap:10px">
            <label class="small muted" style="font-weight:600">EC יעד</label>
            <input id="ecTarget" aria-label="EC יעד (mS/cm)" type="number" step="0.1" style="width:90px;font:inherit;font-size:15px;font-weight:700;text-align:center;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 4px;direction:ltr">
            <span class="small muted">mS/cm</span>
            <button class="btn fert" id="solve" style="margin-inline-start:auto">⚖️ פתור ליעד</button>
          </div>
        </div>

        <div class="hero">
          <div class="ht">💉 הזרקה — ליטר לקוב מים <span class="r">1 קוב = 1,000 ל׳</span></div>
          <div id="stockRows"></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="tiles" id="outTiles"></div>
        <div class="card">
          <h2>יעדי ppm ותוצאה <span class="r">הקלד יעד לכל יסוד</span></h2>
          <div class="elem" id="elements"></div>
          <div class="links" style="margin-top:10px"><button class="btn fert" id="solve2">⚖️ חשב הזרקה מהיעדים</button><span class="muted small" id="fitMsg" style="align-self:center"></span></div>
        </div>
        <div class="card">
          <h2>כמות דשנים <span class="r">גרם לקוב מי השקיה</span></h2>
          <div class="list" id="fertAmt" style="margin-top:0"></div>
        </div>
        <div class="card" id="diffCard" hidden>
          <h2>שינויים מול התוכנית השמורה <span class="r" id="diffName"></span></h2>
          <div id="diffBody"></div>
          <div class="links" style="margin-top:8px"><button class="btn" id="diffUndo">↺ חזור לשמור</button></div>
        </div>
        <div class="links">
          <button class="btn fert" id="saveProg">💾 שמור כתוכנית</button>
          <button class="btn" data-tab="stocks">ערוך סטוקים ›</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== סטוקים ===== -->
  <section id="tab-stocks" hidden>
    <div class="card">
      <h2>הרכב הסטוקים <span class="r">ערכים לכל מיכל · גרם</span></h2>
      <div id="stocksEd"></div>
      <div class="links"><button class="btn" id="addStock">+ סטוק</button><button class="btn fert" id="saveStocks">💾 שמור סטוקים</button></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>ספריית הדשנים <span class="r">אחוז יסוד במוצר – כפי שפרסם היצרן</span></h2>
      <div class="list" id="fertLib" style="margin-top:0"></div>
      <div id="fertEd" hidden>
        <div class="form" style="margin:8px 0"><label style="flex:1 1 100%">שם המוצר<input id="feName" placeholder="למשל: Haifa Cal Prime" style="direction:ltr;text-align:start"></label></div>
        <label class="small muted" style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" id="feOx" style="width:auto"> היצרן מפרסם כתחמוצות (P₂O₅, K₂O, CaO, MgO) – אמיר ליסודות</label>
        <div class="feg" id="feGrid"></div>
        <div class="links" style="margin-top:8px"><button class="btn fert" id="feSave">💾 שמור דשן</button><button class="btn" id="feCancel">ביטול</button><button class="btn" id="feDel" style="color:var(--red)">מחק</button></div>
        <div class="msg" id="feMsg"></div>
      </div>
      <div class="links"><button class="btn" id="feNew">➕ דשן חדש</button></div>
    </div>
  </section>

  <!-- ===== תוכניות ===== -->
  <section id="tab-programs" hidden>
    <div class="card">
      <h2>תוכניות דישון שמורות</h2>
      <div class="list plist" id="progList"></div>
      <p class="muted small" id="progHint" style="margin-top:12px"></p>
    </div>
  </section>
</main>
<div class="wrap"><div class="msg" id="msg"></div></div>

<script src="app.js"></script>
<script src="fert.js"></script>
<script>
$('refresh').innerHTML = ICON.refresh; $('back').innerHTML = ICON.back;
const STCOL = { A: '#5fd38d', B: '#6aa8ff', C: '#c88a2a', D: '#b18cff', E: '#e07a9e', ACID: '#f2a63b' };
const col = (id) => STCOL[id] || '#1f9e8f';
let cur = null;            // התוכנית הפעילה (עותק עבודה)
let inj = {};              // ל/קוב לכל סטוק (מצב עבודה)

/* ---------- ניווט טאבים ---------- */
function showTab(t) {
  document.querySelectorAll('.seg [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  ['calc', 'stocks', 'programs'].forEach((x) => $('tab-' + x).hidden = x !== t);
  if (t === 'stocks') { renderStocksEd(); renderFertLib(); } if (t === 'programs') renderProgList();
}
document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => showTab(b.dataset.tab));

/* ---------- מחשבון ---------- */
function fillProgSelect() {
  $('prog').innerHTML = PROGRAMS.map((p) => '<option value="' + esc(p.id) + '">' + esc(p.name) + (p.phase ? ' · ' + esc(p.phase) : '') + '</option>').join('');
  if (cur) $('prog').value = cur.id;
}
function loadProgram(id) {
  const p = PROGRAMS.find((x) => x.id === id) || PROGRAMS[0];
  cur = JSON.parse(JSON.stringify(p));
  inj = Object.assign({}, cur.inj || {});
  STOCKS.forEach((s) => { if (inj[s.id] == null) inj[s.id] = 0; });
  $('ecTarget').value = cur.targetEC || '';
  setMode(cur.mode || 'ec');
  renderStockRows(); renderElems(); recalc();
}
function setMode(m) { cur.mode = m; document.querySelectorAll('#mode b').forEach((b) => b.classList.toggle('on', b.dataset.m === m)); $('ecTargetRow').style.display = m === 'ec' ? 'flex' : 'none'; }
document.querySelectorAll('#mode b').forEach((b) => b.onclick = () => { setMode(b.dataset.m); recalc(); });

function renderStockRows() {
  $('stockRows').innerHTML = STOCKS.map((s) =>
    '<div class="srow"><span class="tag" style="background:' + col(s.id) + '">' + esc(s.id === 'ACID' ? 'pH' : s.id) + '</span>' +
    '<div class="nm">' + esc(s.name) + '<small>' + esc(s.note || '') + '</small></div>' +
    '<div class="inp"><input type="number" step="0.01" min="0" data-s="' + esc(s.id) + '" value="' + (inj[s.id] || 0) + '"><span class="u">ל׳/קוב</span></div></div>'
  ).join('');
  $('stockRows').querySelectorAll('input').forEach((el) => el.oninput = () => { inj[el.dataset.s] = Math.max(0, Number(el.value) || 0); recalc(); });
}
function renderElems() {
  const T = cur.targets || {};
  $('elements').innerHTML = ELEMS.map((e) => '<div class="el" id="el-' + e + '"><div class="n"><span>' + e + ' <span class="tg">' + ELEM_HE[e] + '</span></span><b id="ev-' + e + '">—</b></div><div class="bar"><i id="eb-' + e + '"></i></div>' +
    '<label class="tgt">יעד<input type="number" inputmode="decimal" step="any" min="0" data-e="' + e + '" value="' + (T[e] != null ? T[e] : '') + '" placeholder="—"></label></div>').join('');
  $('elements').querySelectorAll('input').forEach((i) => i.oninput = () => { cur.targets = cur.targets || {}; const v = i.value === '' ? null : Number(i.value); if (v == null || !isFinite(v) || v < 0) delete cur.targets[i.dataset.e]; else cur.targets[i.dataset.e] = v; recalc(); });
}
function recalc() {
  const r = forward(STOCKS, inj); setTimeout(renderDiff, 0);
  const targets = cur.targets || {};
  $('outTiles').innerHTML = [
    tile('EC מתקבל', fmt(r.ec, 2), 'mS', cur.mode === 'ec' ? 'יעד ' + fmt(Number($('ecTarget').value) || cur.targetEC, 2) : 'הערכה', ''),
    tile('סה״כ יסודות', fmt(r.total), 'ppm', '', ''),
    tile('מינון כולל', fmt(STOCKS.reduce((a, s) => a + (inj[s.id] || 0), 0), 2), 'ל׳/קוב', '', ''),
  ].join('');
  ELEMS.forEach((e) => {
    const v = r.ppm[e] || 0, t = targets[e] || 0, pct = t ? v / t * 100 : 0, el = $('el-' + e); if (!el) return;
    el.className = 'el ' + (!t ? '' : pct > 115 ? 'over' : pct < 85 ? 'low' : '');
    $('ev-' + e).textContent = fmt(v, v < 10 ? 2 : 0); $('eb-' + e).style.width = Math.max(0, Math.min(100, pct)) + '%';
  });
  // how much of each fertilizer ends up in a cubic metre of irrigation water (the same fertilizer in several tanks is summed)
  const amt = {}; STOCKS.forEach((s) => { const q = Number(inj[s.id]) || 0; if (!q || !s.vol) return; (s.items || []).forEach((it) => { amt[it.fert] = (amt[it.fert] || 0) + q * (Number(it.g) || 0) / s.vol; }); });
  const keys = Object.keys(amt).filter((k) => amt[k] > 0).sort((x, y) => amt[y] - amt[x]);
  $('fertAmt').innerHTML = keys.length ? keys.map((k) => '<div class="it"><b>' + esc(k) + '</b><span class="r num">' + fmt(amt[k], amt[k] < 10 ? 1 : 0) + ' g</span></div>').join('') + '<div class="it"><span class="muted">סה״כ</span><span class="r num"><b>' + fmt(keys.reduce((a, k) => a + amt[k], 0)) + ' g</b></span></div>' : '<p class="muted small" style="margin:0">אין הזרקה</p>';
}
$('ecTarget').oninput = recalc;
$('solve').onclick = () => {
  const ecIn = Number($('ecTarget').value) || cur.targetEC || 2.4;
  // יעדי ppm אמיתיים של השלב, מוקטנים/מוגדלים פרופורציונלית ל-EC שבחר המשתמש
  // ppm targets of the phase, scaled up/down until the mix gives the EC asked for (EC as in the sheet: all elements incl. Cl /500 + 0.4)
  const lock = { ACID: inj.ACID || 0 }; if ('E' in inj) lock.E = inj.E || 0;
  let k = 1, sol = null;
  for (let it = 0; it < 6; it++) {
    const targets = {}; ELEMS.forEach((e) => { if (cur.targets[e] != null) targets[e] = cur.targets[e] * k; });
    sol = nnls(STOCKS, targets, { lock });
    const ec = forward(STOCKS, sol).ec, f = (ecIn - EC_WATER) / Math.max(ec - EC_WATER, 0.01);
    if (Math.abs(f - 1) < 0.005) break; k *= f;
  }
  Object.keys(sol).forEach((k) => sol[k] = Math.round(sol[k] * 100) / 100);
  Object.assign(inj, sol);
  renderStockRows(); recalc();
  msg('חושבו הזרקות ליעדי השלב (EC ≈ ' + fmt(ecIn, 1) + ') — אפשר לכוונן ידנית');
};
/* targets typed by hand -> litres of every stock per cubic metre */
$('solve2').onclick = () => {
  const targets = {}; ELEMS.forEach((e) => { const t = cur.targets && cur.targets[e]; if (t != null && isFinite(t)) targets[e] = t; });
  if (!Object.keys(targets).length) { $('fitMsg').textContent = 'הקלד יעד לפחות ליסוד אחד'; return; }
  // the acid stays as typed (it is dosed for pH); the micro tank is solved only when a micro target was typed
  const lock = { ACID: inj.ACID || 0 }; if ('E' in inj && !['Fe', 'Mn', 'Zn', 'B', 'Cu', 'Mo'].some((e) => targets[e] != null)) lock.E = inj.E || 0;
  const sol = nnls(STOCKS, targets, { lock, rel: true });
  Object.keys(sol).forEach((k) => sol[k] = Math.round(sol[k] * 100) / 100);
  Object.assign(inj, sol); renderStockRows(); recalc();
  const r = forward(STOCKS, inj); let worst = null;
  Object.keys(targets).forEach((e) => { if (!targets[e]) return; const d = (r.ppm[e] - targets[e]) / targets[e] * 100; if (!worst || Math.abs(d) > Math.abs(worst[1])) worst = [e, d]; });
  $('fitMsg').textContent = worst && Math.abs(worst[1]) > 10 ? 'הכי רחוק מהיעד: ' + worst[0] + ' ' + (worst[1] > 0 ? '+' : '') + fmt(worst[1]) + '% – הסטוקים הקיימים לא מאפשרים קרוב יותר' : 'כל היסודות בטווח 10% מהיעד';
};
$('saveProg').onclick = async () => {
  const name = prompt('שם התוכנית:', cur.name || 'תוכנית חדשה'); if (!name) return;
  const id = cur.id && cur.name === name ? cur.id : 'p' + Date.now();
  const p = { id, name, phase: cur.phase || '', mode: cur.mode, targetEC: Number($('ecTarget').value) || cur.targetEC, inj: Object.assign({}, inj), targets: cur.targets || {} };
  const i = PROGRAMS.findIndex((x) => x.id === id);
  if (i >= 0) { const old = PROGRAMS[i], same = JSON.stringify(old.inj) === JSON.stringify(p.inj) && old.targetEC === p.targetEC && JSON.stringify(old.targets || {}) === JSON.stringify(p.targets);
    p.history = same ? (old.history || []) : [{ at: new Date().toISOString(), inj: old.inj, targetEC: old.targetEC, targets: old.targets || {} }].concat(old.history || []).slice(0, 5); PROGRAMS[i] = p; }
  else PROGRAMS.push(p);
  cur = JSON.parse(JSON.stringify(p));
  const ok = await pushFert({ programs: PROGRAMS }); fillProgSelect(); $('prog').value = id;
  msg(ok ? 'התוכנית נשמרה וסונכרנה' : 'נשמרה במכשיר — תסונכרן כשהשרת יתמוך');
};
$('prog').onchange = () => loadProgram($('prog').value);

/* ---------- what changed against the saved program ---------- */
const sname = (id) => id === 'ACID' ? 'חומצה' : id;
function diffLine(a, b) { const ks = [...new Set(Object.keys(a || {}).concat(Object.keys(b || {})))].filter((k) => (+(a || {})[k] || 0) !== (+(b || {})[k] || 0)); return ks.length ? ks.map((k) => sname(k) + ' ' + fmt(+(a || {})[k] || 0, 2) + '→' + fmt(+(b || {})[k] || 0, 2)).join(', ') : 'ללא שינוי בהזרקה'; }
function renderDiff() {
  const saved = cur && PROGRAMS.find((p) => p.id === cur.id); if (!saved) { $('diffCard').hidden = true; return; }
  const ecNow = Number($('ecTarget').value) || cur.targetEC, ks = STOCKS.map((s) => s.id).filter((k) => (+(saved.inj || {})[k] || 0) !== (+inj[k] || 0));
  if (!ks.length && (saved.targetEC || 0) === (ecNow || 0)) { $('diffCard').hidden = true; return; }
  const A = forward(STOCKS, saved.inj || {}), B = forward(STOCKS, inj), d = (x, y, n) => { const v = y - x; return Math.abs(v) < Math.pow(10, -n) / 2 ? '' : '<span class="' + (v > 0 ? 'up' : 'dn') + '">' + (v > 0 ? '+' : '') + fmt(v, n) + '</span>'; };
  const rows = ks.map((k) => [sname(k) + ' (ל׳/קוב)', fmt(+(saved.inj || {})[k] || 0, 2), fmt(+inj[k] || 0, 2), d(+(saved.inj || {})[k] || 0, +inj[k] || 0, 2)])
    .concat(ELEMS.filter((e) => Math.abs(B.ppm[e] - A.ppm[e]) >= 0.5).map((e) => [ELEM_HE[e] + ' ' + e + ' (ppm)', fmt(A.ppm[e]), fmt(B.ppm[e]), d(A.ppm[e], B.ppm[e], 0)]))
    .concat([['EC מתקבל', fmt(A.ec, 2), fmt(B.ec, 2), d(A.ec, B.ec, 2)]]);
  $('diffName').textContent = saved.name;
  $('diffBody').innerHTML = '<table class="dtab"><tr><th></th><th>שמור</th><th>עכשיו</th><th>הפרש</th></tr>' + rows.map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>').join('') + '</table>';
  $('diffCard').hidden = false;
}
$('diffUndo').onclick = () => { const saved = PROGRAMS.find((p) => p.id === cur.id); if (!saved) return; inj = Object.assign({}, saved.inj); STOCKS.forEach((s) => { if (inj[s.id] == null) inj[s.id] = 0; }); $('ecTarget').value = saved.targetEC || ''; renderStockRows(); recalc(); };

/* ---------- the fertilizer library: a new product with the percentages of the label ---------- */
const FE_ELEMS = ['N', 'P', 'K', 'Ca', 'Mg', 'S', 'Fe', 'Mn', 'Zn', 'B', 'Cu', 'Mo', 'Cl'];
const OX = { P: ['P₂O₅', 0.4364], K: ['K₂O', 0.8301], Ca: ['CaO', 0.7147], Mg: ['MgO', 0.6030] };   // oxide → element
let feEditing = null;
function renderFertLib() {
  const used = {}; STOCKS.forEach((s) => (s.items || []).forEach((it) => used[it.fert] = (used[it.fert] || []).concat(s.id)));
  $('fertLib').innerHTML = Object.keys(FERTS).sort().map((f) => '<div class="it" data-f="' + esc(f) + '"><b style="direction:ltr">' + esc(f) + '</b><span class="muted small">' + Object.keys(FERTS[f]).filter((e) => FERTS[f][e]).map((e) => e + ' ' + FERTS[f][e]).join(' · ') + (used[f] ? ' · במיכל ' + used[f].join(', ') : '') + '</span><span class="r"><button class="btn small">ערוך</button></span></div>').join('');
  $('fertLib').querySelectorAll('.it').forEach((el) => el.onclick = () => openFe(el.dataset.f));
}
function openFe(name) {
  feEditing = name || null; const c = (name && FERTS[name]) || {};
  $('feName').value = name || ''; $('feOx').checked = false; $('feDel').hidden = !name; $('feMsg').textContent = '';
  const draw = () => { const ox = $('feOx').checked; $('feGrid').innerHTML = FE_ELEMS.map((e) => { const o = ox && OX[e], v = c[e] ? (o ? +(c[e] / o[1]).toFixed(2) : c[e]) : ''; return '<label><b>' + (o ? o[0] : e) + '</b><input type="number" step="0.1" min="0" max="100" data-e="' + e + '" value="' + v + '" aria-label="' + (o ? o[0] : e) + ' %"></label>'; }).join(''); };
  $('feOx').onchange = () => { $('feGrid').querySelectorAll('input').forEach((i) => { const e = i.dataset.e, v = i.value === '' ? null : Number(i.value), o = OX[e]; if (v != null && o) c[e] = $('feOx').checked ? v : v * o[1]; else if (v != null) c[e] = v; else delete c[e]; }); draw(); };
  draw(); $('fertEd').hidden = false; $('feNew').hidden = true; $('fertEd').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('feNew').onclick = () => openFe(null);
$('feCancel').onclick = () => { $('fertEd').hidden = true; $('feNew').hidden = false; };
$('feSave').onclick = async () => {
  const name = $('feName').value.trim(); if (!name) { $('feMsg').textContent = 'צריך שם למוצר'; return; }
  if (name !== feEditing && FERTS[name]) { $('feMsg').textContent = 'כבר יש דשן בשם הזה'; return; }
  const ox = $('feOx').checked, comp = {}; let sum = 0;
  $('feGrid').querySelectorAll('input').forEach((i) => { if (i.value === '') return; const e = i.dataset.e, v = Number(i.value); if (!isFinite(v) || v <= 0) return; comp[e] = +(ox && OX[e] ? v * OX[e][1] : v).toFixed(2); sum += comp[e]; });
  if (!sum) { $('feMsg').textContent = 'הקלד לפחות אחוז אחד'; return; }
  if (sum > 100) { $('feMsg').textContent = 'סך האחוזים מעל 100 – בדוק את הערכים'; return; }
  if (feEditing && feEditing !== name) { delete FERTS[feEditing]; STOCKS.forEach((s) => (s.items || []).forEach((it) => { if (it.fert === feEditing) it.fert = name; })); }
  FERTS[name] = comp;
  const ok = await pushFert({ ferts: FERTS, stocks: STOCKS }); $('fertEd').hidden = true; $('feNew').hidden = false;
  renderFertLib(); renderStocksEd(); recalc(); msg(ok ? 'הדשן "' + name + '" נשמר – אפשר להוסיף אותו לסטוק' : 'נשמר במכשיר');
};
$('feDel').onclick = async () => {
  const n = feEditing; if (!n) return; const inUse = STOCKS.some((s) => (s.items || []).some((it) => it.fert === n));
  if (inUse) { $('feMsg').textContent = 'הדשן נמצא בסטוק – הסר אותו מהסטוק קודם'; return; }
  if (!confirm('למחוק את "' + n + '" מהספרייה?')) return;
  delete FERTS[n]; await pushFert({ ferts: FERTS }); $('fertEd').hidden = true; $('feNew').hidden = false; renderFertLib(); renderStocksEd();
};

/* ---------- עריכת סטוקים ---------- */
function fertOptions(sel) { return Object.keys(FERTS).map((f) => '<option' + (f === sel ? ' selected' : '') + '>' + esc(f) + '</option>').join(''); }
function renderStocksEd() {
  $('stocksEd').innerHTML = STOCKS.map((s, si) =>
    '<div class="stock-ed" data-si="' + si + '"><div class="sh"><span class="tag" style="background:' + col(s.id) + '">' + esc(s.id === 'ACID' ? 'pH' : s.id) + '</span><b>' + esc(s.name) + '</b>' +
    '<span class="muted small" style="margin-inline-start:auto">נפח מיכל</span><input type="number" class="vol" style="width:72px;font:inherit;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 4px;direction:ltr;color:var(--ink)" value="' + s.vol + '"><span class="muted small">ל׳</span></div>' +
    (s.items || []).map((it, ii) => '<div class="itrow" data-ii="' + ii + '"><select class="fert">' + fertOptions(it.fert) + '</select><input class="g" type="number" value="' + it.g + '"><span class="muted small">ג׳</span><button class="del" title="מחק">✕</button></div>').join('') +
    '<button class="btn small addItem" style="margin-top:4px">+ דשן</button></div>'
  ).join('');
  // wiring
  $('stocksEd').querySelectorAll('.stock-ed').forEach((box) => {
    const si = +box.dataset.si, s = STOCKS[si];
    box.querySelector('.vol').oninput = (e) => s.vol = Number(e.target.value) || 1;
    box.querySelectorAll('.itrow').forEach((row) => {
      const ii = +row.dataset.ii;
      row.querySelector('.fert').onchange = (e) => s.items[ii].fert = e.target.value;
      row.querySelector('.g').oninput = (e) => s.items[ii].g = Number(e.target.value) || 0;
      row.querySelector('.del').onclick = () => { s.items.splice(ii, 1); renderStocksEd(); };
    });
    box.querySelector('.addItem').onclick = () => { s.items.push({ fert: Object.keys(FERTS)[0], g: 0 }); renderStocksEd(); };
  });
}
$('addStock').onclick = () => {
  const id = prompt('מזהה הסטוק (אות):', ''); if (!id) return;
  STOCKS.push({ id: id.toUpperCase(), name: 'סטוק ' + id.toUpperCase(), note: '', vol: 100, items: [{ fert: Object.keys(FERTS)[0], g: 0 }] });
  renderStocksEd();
};
$('saveStocks').onclick = async () => { const ok = await pushFert({ stocks: STOCKS }); STOCKS.forEach((s) => { if (inj[s.id] == null) inj[s.id] = 0; }); renderStockRows(); recalc(); msg(ok ? 'הסטוקים נשמרו וסונכרנו' : 'נשמרו במכשיר — יסונכרנו כשהשרת יתמוך'); };

/* ---------- תוכניות ---------- */
function renderProgList() {
  $('progList').innerHTML = PROGRAMS.map((p) =>
    '<div class="it' + (cur && p.id === cur.id ? ' on' : '') + '" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b>' +
    '<span class="muted small">' + esc(p.phase || '') + ' · ' + (p.mode === 'ec' ? 'EC ' + fmt(p.targetEC, 2) : 'ppm') + '</span>' +
    '<span class="r">' + (p.id !== 'default' ? '<button class="del btn small" data-del="' + esc(p.id) + '" style="color:var(--red)">מחק</button>' : '') + '</span>' +
    ((p.history || []).length ? '<div class="hist">' + p.history.map((h, hi) => '<div><span>גרסה מ-' + dm(Date.parse(h.at)) + ' ' + hm(Date.parse(h.at)) + ' · ' + diffLine(h.inj, p.inj) + '</span><button class="btn small" data-hp="' + esc(p.id) + '" data-hi="' + hi + '">פתח</button></div>').join('') + '</div>' : '') + '</div>'
  ).join('');
  $('progList').querySelectorAll('[data-hp]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); const p = PROGRAMS.find((x) => x.id === b.dataset.hp), h = p.history[+b.dataset.hi]; loadProgram(p.id); inj = Object.assign({}, h.inj); if (h.targetEC) $('ecTarget').value = h.targetEC; renderStockRows(); recalc(); fillProgSelect(); showTab('calc'); msg('נפתחה גרסה קודמת – ההבדלים מול השמורה למטה. "שמור" יחזיר אותה.'); });
  $('progList').querySelectorAll('.it').forEach((it) => it.onclick = (e) => { if (e.target.dataset.del) return; loadProgram(it.dataset.id); fillProgSelect(); showTab('calc'); });
  $('progList').querySelectorAll('[data-del]').forEach((b) => b.onclick = async (e) => { e.stopPropagation(); PROGRAMS = PROGRAMS.filter((p) => p.id !== b.dataset.del); await pushFert({ programs: PROGRAMS }); renderProgList(); fillProgSelect(); });
  $('progHint').textContent = PROGRAMS.length + ' תוכניות · נשמרות בשרת ומסונכרנות לכל המכשירים';
}

/* ---------- עזר ---------- */
let msgT; function msg(s) { $('msg').textContent = s; clearTimeout(msgT); msgT = setTimeout(() => $('msg').textContent = '', 4000); }
function showBanner(s) { const b = $('banner'); if (s) { b.textContent = s; b.hidden = false; } else b.hidden = true; }

/* ---------- הפעלה ---------- */
let first = true;
function showAll() {
  const want = decodeURIComponent(location.hash.slice(1)), keep = !first && cur && cur.id;   // batch.html opens the program of the current phase
  loadProgram(((keep && PROGRAMS.find((p) => p.id === keep)) || PROGRAMS.find((p) => p.id === want) || PROGRAMS.find((p) => p.id === 'bulking') || PROGRAMS[0]).id); fillProgSelect();
  $('sub').textContent = STOCKS.length + ' סטוקים · ' + PROGRAMS.length + ' תוכניות';
}
async function init() {
  $('refresh').classList.add('spin');
  if (first) { readLocal(); showAll(); first = false; }       // at once from the copy on the device
  const r = await loadFert();
  $('refresh').classList.remove('spin');
  if (!r.synced) showBanner('עובד במצב מקומי (השרת עדיין לא תומך בסנכרון דישון) — הנתונים נשמרים במכשיר זה בינתיים.');
  else showBanner('');
  showAll();
}
$('refresh').onclick = init;
init();
</script>
</body>
</html>
